name: NYRR 9+1 watch

# GitHub silently drops high-frequency crons (*/10 never fired once in 49 min).
# So instead of relying on the schedule for each poll, each run holds the runner
# for 5.5 hours and polls itself every 5 minutes. The hourly cron only needs to
# land occasionally; cancel-in-progress means a fresh window replaces the old one
# rather than stacking. Public repo => Actions minutes are free.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: nyrr-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Poll every 5 minutes
        env:
          # Deliberately NOT passing Telegram creds: this watcher only reads the
          # listing page, which advertises seats the registration system has
          # already closed. It logs for history; the local bot does the alerting.
          NYRR_NO_TELEGRAM: "1"
          NYRR_STATE: state.json
          NYRR_EVIDENCE: alerts-evidence.jsonl
        run: |
          git config user.name  "nyrr-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 66); do
            echo "--- poll $i/66 at $(date -u +%H:%M:%SZ) ---"
            python3 watch.py || echo "poll failed, continuing"
            # State is committed rather than cached: actions/cache never saves on
            # a cancelled run, which would re-alert every open slot each hour.
            if ! git diff --quiet state.json alerts-evidence.jsonl; then
              git add state.json alerts-evidence.jsonl
              git commit -qm "state: open 9+1 slots changed [skip ci]"
              git pull --rebase --autostash -q || true
              git push -q || echo "push failed, will retry next change"
            fi
            [ "$i" -lt 66 ] && sleep 300
          done
