name: NYRR 9+1 watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; GitHub may add its own delay
  workflow_dispatch:          # lets you trigger a check by hand

concurrency:
  group: nyrr-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # State carries the set of already-alerted slots between runs so a slot
      # that stays open doesn't re-ping every 10 minutes.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: nyrr-state-${{ github.run_id }}
          restore-keys: nyrr-state-

      - run: python3 watch.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # GitHub disables scheduled workflows after 60 days of repo inactivity,
      # and this needs to survive until the 2026 program closes on Dec 31.
      # One commit a week (Mondays around noon UTC) keeps the repo "active".
      - name: Weekly heartbeat commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "12" ] && [ "$(date -u +%M)" -lt 10 ]; then
            date -u +"last heartbeat: %Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
            git config user.name  "nyrr-watch bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat: keep scheduled workflow alive" || exit 0
            git push
          fi
